spring.application.name=CartService
server.port=8083

# mongodb (source of truth for cart & order documents)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=cartservice

# redis (cache-aside in front of mongodb for fast cart reads)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ProductCatalogService base url, resolved via Eureka service discovery instead of a fixed host:port
product-catalog-service.base-url=http://ProductCatalogService/api

# Eureka service registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
