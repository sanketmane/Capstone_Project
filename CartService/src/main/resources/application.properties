spring.application.name=CartService
server.port=8083

# mongodb (source of truth for cart & order documents)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=cartservice

# redis (cache-aside in front of mongodb for fast cart reads)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ProductCatalogService base url, used to fetch canonical product name/price
product-catalog-service.base-url=http://localhost:8085/api
