spring.application.name=OrderManagementService
server.port=8084

# mysql (source of truth for order & order_item tables)
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/ordermanagementservice
spring.datasource.username=root
spring.datasource.password=test@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# CartService base url, resolved via Eureka service discovery instead of a fixed host:port
cart-service.base-url=http://CartService/api/cart

# Eureka service registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
