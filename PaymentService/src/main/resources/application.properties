spring.application.name=PaymentService
server.port=8080

spring.config.import=optional:file:.env[.properties]

# get razorpay key/secret by registering with RazorPay
# masking the original key/secret here.
razorpay.key.id:000
razorpay.key.secret:000
stripe.apiKey=${STRIPE_API_KEY}

# webhook signing secrets, masked here (get real values from each gateway's dashboard)
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}
razorpay.webhook.secret=000

# mysql (source of truth for the payments table)
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/paymentservice
spring.datasource.username=root
spring.datasource.password=test@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true

# OrderManagementService base url, resolved via Eureka service discovery instead of a fixed host:port
order-service.base-url=http://OrderManagementService/api/orders

# Eureka service registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
